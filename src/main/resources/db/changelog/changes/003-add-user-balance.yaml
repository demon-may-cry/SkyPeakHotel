databaseChangeLog:
    - changeSet:
        id: 3
        author: Dmitriy_Eltsov

        changes:
          - createTable:
                tableName: user_balances
                columns:
                    - column:
                        name: id
                        type: UUID
                        constraints:
                          primaryKey: true
                          nullable: false

                    - column:
                        name: user_id
                        type: UUID
                        constraints:
                          nullable: false

                    - column:
                        name: balance
                        type: numeric(12,2)
                        constraints:
                          nullable: false

                    - column:
                        name: updated_at
                        type: timestamp
                        constraints:
                          nullable: false

          - addUniqueConstraint:
              tableName: user_balances
              columnNames: user_id
              constraintName: uq_user_balances_user

          - addForeignKeyConstraint:
              baseTableName: user_balances
              baseColumnNames: user_id
              referencedTableName: users
              referencedColumnNames: id
              constraintName: fk_user_balances_user

          - createTable:
                tableName: balance_transactions
                columns:
                    - column:
                        name: id
                        type: UUID
                        constraints:
                          primaryKey: true
                          nullable: false

                    - column:
                        name: user_id
                        type: UUID
                        constraints:
                          nullable: false
                          
                    - column:
                        name: amount
                        type: numeric(12,2)
                        constraints:
                          nullable: false

                    - column:
                        name: type
                        type: varchar(20)
                        constraints:
                          nullable: false

                    - column:
                        name: description
                        type: varchar(255)
                        constraints:
                          nullable: true

                    - column:
                        name: created_at
                        type: timestamp
                        constraints:
                          nullable: false

          - createIndex:
                tableName: balance_transactions
                indexName: idx_balance_transactions_user
                columns:
                    - column:
                        name: user_id

          - addForeignKeyConstraint:
              baseTableName: balance_transactions
              baseColumnNames: user_id
              referencedTableName: users
              referencedColumnNames: id
              constraintName: fk_balance_transactions_user

          - sql:
              sql: |
                ALTER TABLE user_balances
                ADD CONSTRAINT chk_user_balance_non_negative
                CHECK (balance >= 0);

          - sql:
              sql: |
                ALTER TABLE balance_transactions
                ADD CONSTRAINT chk_balance_transaction_amount_positive
                CHECK (amount > 0);

          - sql:
              sql: |
                ALTER TABLE balance_transactions
                ADD CONSTRAINT chk_balance_transaction_type
                CHECK (type IN ('DEPOSIT', 'WITHDRAW'));