# Вставляем стандартные номера в таблицу rooms
databaseChangeLog:
  - changeSet:
      id: 4
      author: Dmitriy_Eltsov

      changes:
#       Комната № 101 - Стандарт
        - insert:
            tableName: rooms
            columns:
              - column:
                  name: id
                  valueComputed: gen_random_uuid()

              - column:
                  name: room_number
                  value: "101"

              - column:
                  name: room_type
                  value: STANDARD

              - column:
                  name: price_per_night
                  valueNumeric: "9500.00"

              - column:
                  name: active
                  valueBoolean: "true"

              - column:
                  name: description
                  value: "Уютный стандартный номер с современным интерьером, большой кроватью, рабочей зоной и всем необходимым для комфортного отдыха в горах."

