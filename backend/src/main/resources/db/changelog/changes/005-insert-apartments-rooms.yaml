# Вставляем апартаменты в таблицу rooms
databaseChangeLog:
  - changeSet:
      id: 5
      author: Dmitriy_Eltsov

      changes:
#       Комната № 201 - Апартаменты
        - insert:
            tableName: rooms
            columns:
              - column:
                  name: id
                  valueComputed: gen_random_uuid()

              - column:
                  name: room_number
                  value: "201"

              - column:
                  name: room_type
                  value: APARTMENTS

              - column:
                  name: price_per_night
                  valueNumeric: "16000.00"

              - column:
                  name: active
                  valueBoolean: "true"

              - column:
                  name: description
                  value: "Просторные апартаменты с отдельной гостиной зоной, мини-кухней и панорамными окнами для идеального семейного отдыха."
        
