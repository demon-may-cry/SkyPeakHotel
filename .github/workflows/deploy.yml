name: Deploy SkyPeak Hotel Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # 1. Получаем исходный код
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Авторизация в Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 3. Сборка Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t dmitryeltsov/skypeak-hotel-backend:latest \
            ./backend

      # 4. Отправка image в Docker Hub
      - name: Push Docker image
        run: |
          docker push dmitryeltsov/skypeak-hotel-backend:latest

      # 5. Подключение к VPS и обновление backend
      - name: Deploy to VPS
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$SSH_PRIVATE_KEY" > ~/.ssh/skypeak-github-actions
          chmod 600 ~/.ssh/skypeak-github-actions

          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/skypeak-github-actions \
            "$SERVER_USER@$SERVER_HOST" \
            "cd /opt/skypeak-hotel && \
             docker compose pull backend && \
             docker compose up -d --no-deps backend"