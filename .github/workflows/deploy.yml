name: Deploy SkyPeak Hotel Backend

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
            -t dmitryeltsov/skypeak-hotel-backend:${IMAGE_TAG} \
            ./backend

      - name: Push Docker image
        run: |
          docker push dmitryeltsov/skypeak-hotel-backend:${IMAGE_TAG}

      - name: Deploy to VPS
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "$SSH_PRIVATE_KEY" > ~/.ssh/skypeak-github-actions
          chmod 600 ~/.ssh/skypeak-github-actions

          ssh-keyscan -H "$SERVER_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/skypeak-github-actions \
            "$SERVER_USER@$SERVER_HOST" \
            "cd /opt/skypeak-hotel && \
             echo 'IMAGE_TAG=${IMAGE_TAG}' > .env.deploy && \
             docker compose --env-file .env --env-file .env.deploy pull backend && \
             docker compose --env-file .env --env-file .env.deploy up -d --no-deps backend"